<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Idea Cauldron: every project, its stage, and what the AI team shipped." />
  <title>Idea Cauldron</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#top"><span class="paw" aria-hidden="true">🐾</span><span>Idea Cauldron</span></a>
    <nav>
      <a href="#projects" data-i18n="nav.projects">Projects</a>
      <a href="#shipped" data-i18n="nav.shipped">Shipped</a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <span class="pill" id="pipeline-pill"><span class="dot"></span><span id="pipeline-text">…</span></span>
      <h1><span data-i18n="hero.line1">Ideas in,</span><br /><span class="gradient" data-i18n="hero.line2">products out.</span></h1>
      <p class="lede" data-i18n="hero.lede">Your AI team builds, reviews, and ships on its own. Here is where every project stands.</p>
      <div class="hero-cat"><img src="assets/cat-hero-main.webp" alt="" /></div>
      <div class="stats">
        <div class="stat"><strong id="stat-projects">–</strong><span data-i18n="stat.projects">projects</span></div>
        <div class="stat"><strong id="stat-shipped">–</strong><span data-i18n="stat.shipped">shipped in 7 days</span></div>
        <div class="stat"><strong id="stat-active">–</strong><span data-i18n="stat.active">being worked on now</span></div>
      </div>
    </section>

    <section id="projects" class="section">
      <div class="section-head">
        <div>
          <span class="eyebrow" data-i18n="projects.eyebrow">Portfolio</span>
          <h2 data-i18n="projects.title">Every project at a glance</h2>
        </div>
        <img class="section-cat" src="assets/cat-boss.webp" alt="" />
      </div>
      <div id="project-grid" class="project-grid"></div>
    </section>

    <section id="shipped" class="section">
      <div class="section-head">
        <div>
          <span class="eyebrow" data-i18n="shipped.eyebrow">Shipped</span>
          <h2 data-i18n="shipped.title">What the team finished</h2>
        </div>
        <div class="range" role="group" aria-label="Range">
          <button type="button" data-range="3" data-i18n="range.3">3 days</button>
          <button type="button" data-range="7" data-i18n="range.7">7 days</button>
        </div>
      </div>
      <div class="shipped-wrap">
        <ol id="shipped-list" class="shipped-list"></ol>
        <img class="shipped-cat" src="assets/cat-queue.webp" alt="" />
      </div>
    </section>
  </main>

  <footer>
    <img src="assets/cat-working.webp" alt="" />
    <span id="updated"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
