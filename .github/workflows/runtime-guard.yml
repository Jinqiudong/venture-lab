name: Agent Runtime Guard

on:
  workflow_dispatch:
  repository_dispatch:
    types: [portfolio-refresh, orchestrator-tick]
  schedule:
    - cron: "18,48 * * * *"
  push:
    branches: [main]
    paths:
      - "orchestrator/runtime.py"
      - "scripts/enforce_runtime_guard.py"
      - ".github/workflows/runtime-guard.yml"
      - "tests/test_runtime.py"

permissions:
  contents: read

concurrency:
  group: agent-review-cycle
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Run runtime guard unit tests
        run: python -m pytest -q tests/test_runtime.py

      - name: Check runtime configuration
        id: config
        env:
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          if [ -z "$AGENT_GITHUB_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AGENT_GITHUB_TOKEN not configured; live guard is idle."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce automatic fix cap
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: python scripts/enforce_runtime_guard.py
