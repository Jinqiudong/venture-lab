name: Portfolio Dashboard

on:
  workflow_dispatch:
  repository_dispatch:
    types: [portfolio-refresh]
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "scripts/generate_dashboard.py"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "scripts/generate_dashboard.py"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate portfolio data
        env:
          PORTFOLIO_GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_dashboard.py

      - name: Validate generated JSON
        run: python3 -m json.tool dashboard/data.json > /dev/null

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
