name: Agent Orchestrator

on:
  workflow_dispatch:
  # The AI Team Heartbeat workflow wakes the Orchestrator every 10 minutes; product-repo CI events wake it sooner.
  repository_dispatch:
    types: [portfolio-refresh, orchestrator-tick]
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "orchestrator/**"
      - "scripts/orchestrate.py"
      - "scripts/checkpoint_watcher.py"
      - "dashboard/projects.json"
      - ".github/workflows/orchestrator.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: agent-orchestrator
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_dispatch: ${{ steps.decide.outputs.should_dispatch }}
      should_review: ${{ steps.decide.outputs.should_review }}
      auto_stop: ${{ steps.decide.outputs.auto_stop }}
      repo: ${{ steps.decide.outputs.repo }}
      issue: ${{ steps.decide.outputs.issue }}
      project: ${{ steps.decide.outputs.project }}
      title: ${{ steps.decide.outputs.title }}
      failure_count: ${{ steps.decide.outputs.failure_count }}
      dispatch_items: ${{ steps.decide.outputs.dispatch_items }}
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Refresh project state
        env:
          PORTFOLIO_GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_dashboard.py

      - name: Decide next orchestration action
        id: decide
        env:
          PORTFOLIO_GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/orchestrate.py

  auto-stop:
    needs: decide
    if: needs.decide.outputs.auto_stop == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mark issue for human intervention
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.decide.outputs.repo }}
          ISSUE_NUMBER: ${{ needs.decide.outputs.issue }}
          FAILURE_COUNT: ${{ needs.decide.outputs.failure_count }}
        run: |
          marker="<!-- venture-auto-stop -->"
          if gh api "repos/$TARGET_REPO/issues/$ISSUE_NUMBER/comments" --paginate --jq '.[].body' 2>/dev/null | grep -Fq "$marker"; then
            echo "Auto-stop already recorded."
            exit 0
          fi
          BODY_FILE=$(mktemp)
          {
            printf '%s\n' "$marker"
            printf '### 🛑 Auto-stop: needs human intervention\n\n'
            printf 'Builder has failed or been cancelled **%s times** without producing a PR.\n\n' "$FAILURE_COUNT"
            printf '**Automation:** paused for this Issue; the Orchestrator will not retry it automatically.\n\n'
            printf '**Next:** check the failed runs above. When the cause is fixed, comment `/retry` (or `重试`) on this Issue and the Builder starts again.\n'
          } > "$BODY_FILE"
          gh issue comment "$ISSUE_NUMBER" --repo "$TARGET_REPO" --body-file "$BODY_FILE"

  wake-review:
    needs: decide
    if: needs.decide.outputs.should_review == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wake independent review cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/review-cycle.yml/dispatches" \
            -f ref='main'
          echo "Dispatched Agent Review Cycle directly."

  build:
    needs: decide
    if: needs.decide.outputs.should_dispatch == 'true'
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.decide.outputs.dispatch_items) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_REPO: ${{ matrix.item.repo }}
      ISSUE_NUMBER: ${{ matrix.item.issue }}
      PROJECT_NAME: ${{ matrix.item.project }}
      ISSUE_TITLE: ${{ matrix.item.title }}
      BRANCH_NAME: agent/issue-${{ matrix.item.issue }}
      CHECKPOINT_BRANCH: checkpoint/issue-${{ matrix.item.issue }}/run-${{ github.run_id }}
    steps:
      - name: Validate agent runtime configuration
        env:
          AGENT_CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.ANTHROPIC_API_KEY || secrets.OPENAI_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          if [ -z "$AGENT_CREDENTIAL" ]; then
            echo "No agent credential (CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY or OPENAI_API_KEY) is configured in venture-lab Actions secrets." >&2
            exit 1
          fi
          if [ -z "$AGENT_GITHUB_TOKEN" ]; then
            echo "AGENT_GITHUB_TOKEN is not configured in venture-lab Actions secrets." >&2
            exit 1
          fi

      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          path: control-plane

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.item.repo }}
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - name: Prepare implementation branch
        id: base
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          # Issues in an open GitHub milestone build on that milestone's branch; others on the default branch.
          BASE_BRANCH=$(python3 control-plane/scripts/milestones.py base --repo "$TARGET_REPO" --issue "$ISSUE_NUMBER")
          echo "branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          # The checkout keeps no credentials, and the milestone branch may have been created after it.
          git -C target fetch "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          git -C target checkout -B "$BRANCH_NAME" "origin/$BASE_BRANCH"

      - name: Build agent prompt
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          ISSUE_BODY=$(gh api "repos/$TARGET_REPO/issues/$ISSUE_NUMBER" --jq '.body // ""')
          {
            cat control-plane/agents/builder.md
            printf '\n\n---\n\n# Assigned work\n\n'
            printf 'Project: %s\n' "$PROJECT_NAME"
            printf 'Repository: %s\n' "$TARGET_REPO"
            printf 'Issue: #%s\n' "$ISSUE_NUMBER"
            printf 'Title: %s\n\n' "$ISSUE_TITLE"
            printf '## Issue body\n\n%s\n' "$ISSUE_BODY"
            printf '\n## Orchestration constraints\n\n'
            printf '%s\n' '- Work only inside the checked-out repository.'
            printf '%s\n' '- Do not create, merge, or approve a pull request yourself.'
            printf '%s\n' '- Do not access GitHub credentials or secrets.'
            printf '%s\n' '- The workflow will commit and open the PR after you finish.'
            printf '%s\n' '- Prioritize a minimal implementation that satisfies the acceptance criteria.'
            printf '%s\n' '- Do not spend time on simulator UI polish or unrelated refactors.'
          } > builder-prompt.md

      - name: Publish Builder checkpoint
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          marker="<!-- venture-checkpoint:builder-start:${GITHUB_RUN_ID} -->"
          if ! gh api "repos/$TARGET_REPO/issues/$ISSUE_NUMBER/comments" --paginate --jq '.[].body' 2>/dev/null | grep -Fq "$marker"; then
            BODY_FILE=$(mktemp)
            {
              printf '%s\n' "$marker"
              printf '### 🛠 Builder started\n\n'
              printf 'Implementing **#%s %s** from the canonical Issue contract.\n\n' "$ISSUE_NUMBER" "$ISSUE_TITLE"
              printf '**Why now:** dependencies are satisfied and this is the next ready work item.\n\n'
              printf '**Recovery:** work is checkpointed to `%s` while the Builder runs.\n\n' "$CHECKPOINT_BRANCH"
              printf '**Next checkpoint:** PR opened.\n\n'
              printf '[View agent run](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            } > "$BODY_FILE"
            gh issue comment "$ISSUE_NUMBER" --repo "$TARGET_REPO" --body-file "$BODY_FILE"
          fi

      - name: Start workspace checkpoint watcher
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          nohup python3 control-plane/scripts/checkpoint_watcher.py \
            --source "$GITHUB_WORKSPACE/target" \
            --issue "$ISSUE_NUMBER" \
            --run-id "$GITHUB_RUN_ID" \
            --interval 90 \
            > "$RUNNER_TEMP/checkpoint-watcher.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/checkpoint-watcher.pid"
          echo "Checkpoint watcher started for $CHECKPOINT_BRANCH"

      - name: Run Builder agent
        id: codex
        uses: ./control-plane/.github/actions/run-agent
        with:
          provider: ${{ vars.AGENT_PROVIDER }}
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          working-directory: target
          prompt-file: builder-prompt.md
          effort: medium

      - name: Stop workspace checkpoint watcher
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/checkpoint-watcher.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/checkpoint-watcher.pid")" 2>/dev/null || true
          fi
          cat "$RUNNER_TEMP/checkpoint-watcher.log" 2>/dev/null || true

      - name: Inspect Builder changes
        id: changes
        working-directory: target
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Commit and push implementation
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          git config user.name "venture-lab-builder[bot]"
          git config user.email "venture-lab-builder@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement issue #$ISSUE_NUMBER"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" "HEAD:${BRANCH_NAME}" --force-with-lease

      - name: Open implementation pull request
        if: steps.changes.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          BUILDER_SUMMARY: ${{ steps.codex.outputs.final-message }}
          BASE_BRANCH: ${{ steps.base.outputs.branch }}
        run: |
          BODY_FILE=$(mktemp)
          {
            printf 'Closes #%s\n\n' "$ISSUE_NUMBER"
            printf '## Autonomous Builder\n'
            printf 'Implemented by the Venture Lab Builder agent from the canonical GitHub Issue contract.\n\n'
            printf '## Builder report\n%s\n\n' "$BUILDER_SUMMARY"
            printf '## Merge policy\n'
            printf 'Independent Review, QA and CI decide. A routine change merges automatically into `%s`; risk categories still go to the Product Owner.\n' "$BASE_BRANCH"
          } > "$BODY_FILE"
          PR_URL=$(gh pr create --repo "$TARGET_REPO" --base "$BASE_BRANCH" --head "$BRANCH_NAME" --title "feat: $ISSUE_TITLE" --body-file "$BODY_FILE")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Opened $PR_URL"
          git -C target push "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" --delete "$CHECKPOINT_BRANCH" 2>/dev/null || true

      - name: Open review cycle after PR creation
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/review-cycle.yml/dispatches" \
            -f ref='main'
          echo "Dispatched Review Cycle after Builder PR creation."

      - name: Report no-change Builder run
        if: steps.changes.outputs.has_changes != 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          BUILDER_SUMMARY: ${{ steps.codex.outputs.final-message }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$TARGET_REPO" --body "### Builder could not produce an implementation\n\n$BUILDER_SUMMARY\n\nThe orchestrator did not close or modify the Issue. Human/product clarification may be required."
