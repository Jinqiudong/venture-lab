name: Agent Review Cycle

on:
  workflow_dispatch:
  repository_dispatch:
    types: [portfolio-refresh, orchestrator-tick]
  schedule:
    - cron: "23,53 * * * *"
  push:
    branches: [main]
    paths:
      - "agents/**"
      - ".github/workflows/review-cycle.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: agent-review-cycle
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.pick.outputs.configured }}
      found: ${{ steps.pick.outputs.found }}
      repo: ${{ steps.pick.outputs.repo }}
      pr: ${{ steps.pick.outputs.pr }}
      head: ${{ steps.pick.outputs.head }}
      branch: ${{ steps.pick.outputs.branch }}
      issue: ${{ steps.pick.outputs.issue }}
      title: ${{ steps.pick.outputs.title }}
      fixer_used: ${{ steps.pick.outputs.fixer_used }}
      ci_pending: ${{ steps.pick.outputs.ci_pending }}
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          path: control

      - name: Find next managed PR
        id: pick
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "fixer_used=false" >> "$GITHUB_OUTPUT"
          echo "ci_pending=false" >> "$GITHUB_OUTPUT"
          if [ -z "$GH_TOKEN" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "Agent runtime not configured; review cycle is idle."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            prs=$(gh pr list --repo "$repo" --state open --limit 30 --json number,headRefName,headRefOid,title,body,updatedAt)
            count=$(printf '%s' "$prs" | jq 'length')
            [ "$count" -eq 0 ] && continue
            for idx in $(seq 0 $((count - 1))); do
              pr=$(printf '%s' "$prs" | jq -r ".[$idx].number")
              head=$(printf '%s' "$prs" | jq -r ".[$idx].headRefOid")
              branch=$(printf '%s' "$prs" | jq -r ".[$idx].headRefName")
              title=$(printf '%s' "$prs" | jq -r ".[$idx].title")
              body=$(printf '%s' "$prs" | jq -r ".[$idx].body // \"\"")
              issue=$(printf '%s\n' "$body" | grep -oE 'Closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
              [ -z "$issue" ] && continue

              comments=$(gh api "repos/$repo/issues/$pr/comments" --paginate 2>/dev/null || printf '[]')
              handoff_at=$(printf '%s' "$comments" | jq -r --arg marker "<!-- venture-human-ready:$head -->" '[.[] | select((.body // "") | contains($marker)) | .created_at] | max // ""')
              decision_at=$(printf '%s' "$comments" | jq -r '[.[] | select((.body // "") | contains("<!-- venture-human-decision -->")) | .created_at] | max // ""')
              fixer_used=$(printf '%s' "$comments" | jq -r --arg marker "<!-- venture-fixer-attempt:$head -->" 'any(.[]; (.body // "") | contains($marker))')
              ci_pending=$(gh run list --repo "$repo" --commit "$head" --limit 50 --json status,event 2>/dev/null | jq -r 'any(.[]; .event=="pull_request" and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending"))' || printf 'false')
              if [ -n "$handoff_at" ] && { [ -z "$decision_at" ] || [[ "$decision_at" < "$handoff_at" ]]; }; then
                continue
              fi

              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "repo=$repo" >> "$GITHUB_OUTPUT"
              echo "pr=$pr" >> "$GITHUB_OUTPUT"
              echo "head=$head" >> "$GITHUB_OUTPUT"
              echo "branch=$branch" >> "$GITHUB_OUTPUT"
              echo "issue=$issue" >> "$GITHUB_OUTPUT"
              echo "title=$title" >> "$GITHUB_OUTPUT"
              echo "fixer_used=$fixer_used" >> "$GITHUB_OUTPUT"
              echo "ci_pending=$ci_pending" >> "$GITHUB_OUTPUT"
              echo "Selected $repo PR #$pr ($head)"
              exit 0
            done
          done < <(jq -r '.projects[].repo' control/dashboard/projects.json)

          echo "No managed PR needs review."

  resume_human_decision:
    needs: select
    if: needs.select.outputs.configured == 'true' && needs.select.outputs.found == 'true'
    runs-on: ubuntu-latest
    outputs:
      resumed: ${{ steps.detect.outputs.resumed }}
    steps:
      - name: Detect resolved human handoff
        id: detect
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          HEAD_SHA: ${{ needs.select.outputs.head }}
        run: |
          echo "resumed=false" >> "$GITHUB_OUTPUT"
          comments=$(gh api "repos/$TARGET_REPO/issues/$PR_NUMBER/comments" --paginate)
          handoff_at=$(printf '%s' "$comments" | jq -r --arg marker "<!-- venture-human-ready:$HEAD_SHA -->" '[.[] | select((.body // "") | contains($marker)) | .created_at] | max // ""')
          decision_at=$(printf '%s' "$comments" | jq -r '[.[] | select((.body // "") | contains("<!-- venture-human-decision -->")) | .created_at] | max // ""')
          if [ -n "$handoff_at" ] && [ -n "$decision_at" ] && [[ "$decision_at" > "$handoff_at" ]]; then
            echo "resumed=true" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: select
    if: needs.select.outputs.configured == 'true' && needs.select.outputs.found == 'true' && needs.select.outputs.ci_pending != 'true'
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.parse.outputs.verdict }}
      request_changes: ${{ steps.parse.outputs.request_changes }}
      needs_human: ${{ steps.parse.outputs.needs_human }}
    steps:
      - name: Mark one-shot Fixer attempt
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          HEAD_SHA: ${{ needs.select.outputs.head }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body "<!-- venture-fixer-attempt:$HEAD_SHA -->
### 🔧 Fixer attempt

One automatic Fixer attempt is being used for this exact PR HEAD. If this HEAD remains blocked, automation will stop instead of retrying Fixer."

      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.select.outputs.repo }}
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          ref: ${{ needs.select.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - name: Build Reviewer prompt
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          ISSUE_NUMBER: ${{ needs.select.outputs.issue }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
        run: |
          ISSUE_BODY=$(gh api "repos/$TARGET_REPO/issues/$ISSUE_NUMBER" --jq '.body // ""')
          PR_BODY=$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json body --jq '.body // ""')
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json headRefOid --jq '.headRefOid')
          CHECK_RUNS='[]'
          WORKFLOW_RUNS=$(gh run list --repo "$TARGET_REPO" --commit "$HEAD_SHA" --limit 50 --json databaseId,name,status,conclusion,event,url 2>/dev/null | jq -c '[.[] | {id:.databaseId,name,status,conclusion,event,html_url:.url}]' || printf '[]')
          FAILED_RUN_DETAILS=$(printf '%s' "$WORKFLOW_RUNS" | jq -r '.[] | select(.conclusion=="failure") | .id' | while read -r run_id; do [ -z "$run_id" ] && continue; gh run view "$run_id" --repo "$TARGET_REPO" --log-failed 2>/dev/null | tail -n 120 || true; done)
          {
            cat control/agents/reviewer.md
            printf '\n\n---\n# Review assignment\n'
            printf 'Repository: %s\nIssue: #%s\nPR: #%s\n\n' "$TARGET_REPO" "$ISSUE_NUMBER" "$PR_NUMBER"
            printf '## Issue contract\n%s\n\n## Pull request description\n%s\n' "$ISSUE_BODY" "$PR_BODY"
            printf '\n## GitHub CI evidence for current PR HEAD (%s)\n### Check runs\n%s\n\n### Workflow runs\n%s\n\n### Failed workflow details\n%s\n' "$HEAD_SHA" "$CHECK_RUNS" "$WORKFLOW_RUNS" "$FAILED_RUN_DETAILS"
            printf '\nTreat successful GitHub Actions runs on the current PR HEAD as authoritative evidence for platform-specific CI that this Linux agent cannot execute locally. If a required platform workflow failed, inspect the supplied failed-run details and convert concrete code/configuration failures into actionable findings for Fixer. Do not reduce a real linker/build/test failure to a generic request for someone to run macOS. A missing or pending check may still block approval.\n'
            printf '\nInspect the checkout and `git diff origin/main...HEAD`. Return only schema-valid JSON.\n'
          } > reviewer-prompt.md

      - name: Run independent Reviewer
        id: reviewer
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          working-directory: target
          prompt-file: reviewer-prompt.md
          output-schema-file: ${{ github.workspace }}/control/agents/review-schema.json
          output-file: ${{ github.workspace }}/review-result.json
          allow-bots: true

      - name: Parse Reviewer result
        id: parse
        run: |
          cat review-result.json | jq .
          verdict=$(jq -r '.verdict' review-result.json)
          needs_human=$(jq -r '.needs_human' review-result.json)
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "needs_human=$needs_human" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = "request_changes" ]; then echo "request_changes=true" >> "$GITHUB_OUTPUT"; else echo "request_changes=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish Reviewer report
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          HEAD_SHA: ${{ needs.select.outputs.head }}
        run: |
          {
            printf '<!-- venture-review:%s -->\n' "$HEAD_SHA"
            printf '### 🤖 Independent Reviewer\n\n'
            jq -r '"**Verdict:** `" + .verdict + "`\n\n" + .summary + "\n\n" + (if (.findings|length)>0 then "#### Findings\n" + ([.findings[] | "- **" + .severity + " — " + .title + ":** " + .detail] | join("\n")) else "No blocking findings." end) + (if .needs_human then "\n\n**Needs product input:** " + .human_question else "" end)' review-result.json
          } > review-comment.md
          gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body-file review-comment.md

      - name: Upload Reviewer result
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-result
          path: review-result.json
          retention-days: 3

  fix_review:
    needs: [select, review, resume_human_decision]
    if: needs.review.outputs.request_changes == 'true' && needs.select.outputs.fixer_used != 'true' && (needs.review.outputs.needs_human != 'true' || needs.resume_human_decision.outputs.resumed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.select.outputs.repo }}
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          ref: ${{ needs.select.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - uses: actions/download-artifact@v4
        with:
          name: reviewer-result
          path: reports

      - name: Build Fixer prompt
        run: |
          {
            cat control/agents/fixer.md
            printf '\n\n---\n# Reviewer report\n'
            cat reports/review-result.json
            printf '\n\n# Platform-validation rule\nIf the report mixes code findings with platform-only validation findings, fix every actionable code/configuration finding. Do not skip the whole Fixer run merely because some validation requires macOS/Xcode. You may leave only the irreducible platform execution itself to CI.\n'
            if [ "${{ needs.resume_human_decision.outputs.resumed }}" = "true" ]; then
              printf '\n\n# Product Owner decision\nThe prior human gate has been resolved. Re-read the current canonical Issue contract and PR comments, implement the approved decision, and do not ask the already-resolved question again.\n'
            fi
          } > fixer-prompt.md

      - name: Run Fixer
        id: fixer
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          working-directory: target
          prompt-file: fixer-prompt.md
          allow-bots: true

      - name: Commit and push fixes
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          BRANCH_NAME: ${{ needs.select.outputs.branch }}
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Fixer produced no changes."
            exit 0
          fi
          git config user.name "venture-lab-fixer[bot]"
          git config user.email "venture-lab-fixer@users.noreply.github.com"
          git add -A
          git commit -m "fix: address independent review findings"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" "HEAD:${BRANCH_NAME}"

      - name: Report Fixer cycle
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          FIXER_SUMMARY: ${{ steps.fixer.outputs.final-message }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body "### 🔧 Fixer\n\n$FIXER_SUMMARY\n\nA fresh Reviewer pass will run against the new commit."


  stop_after_fixer_budget:
    needs: [select, review]
    if: needs.review.outputs.request_changes == 'true' && needs.select.outputs.fixer_used == 'true' && needs.review.outputs.needs_human != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report exhausted Fixer budget
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          HEAD_SHA: ${{ needs.select.outputs.head }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body "<!-- venture-auto-stop:$HEAD_SHA -->
### ⏸️ Automation stopped

This exact PR HEAD already used its one automatic Fixer attempt and is still blocked. No additional Reviewer/Fixer loop will run for this HEAD.

Push a new commit (new HEAD) to reset the one-shot Fixer budget, or resolve the blocker manually."


  qa:
    needs: [select, review]
    if: needs.review.outputs.verdict == 'approve' && needs.review.outputs.needs_human != 'true'
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.parse.outputs.verdict }}
      needs_human: ${{ steps.parse.outputs.needs_human }}
      auto_merge_eligible: ${{ steps.risk.outputs.eligible }}
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.select.outputs.repo }}
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          ref: ${{ needs.select.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - name: Build QA prompt
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          ISSUE_NUMBER: ${{ needs.select.outputs.issue }}
        run: |
          ISSUE_BODY=$(gh api "repos/$TARGET_REPO/issues/$ISSUE_NUMBER" --jq '.body // ""')
          HEAD_SHA=$(git -C target rev-parse HEAD)
          CHECK_RUNS='[]'
          WORKFLOW_RUNS=$(gh run list --repo "$TARGET_REPO" --commit "$HEAD_SHA" --limit 50 --json name,status,conclusion,event,url 2>/dev/null | jq -c '[.[] | {name,status,conclusion,event,html_url:.url}]' || printf '[]')
          {
            cat control/agents/qa.md
            printf '\n\n---\n# QA assignment\nRepository: %s\nIssue: #%s\n\n## Issue contract\n%s\n' "$TARGET_REPO" "$ISSUE_NUMBER" "$ISSUE_BODY"
            printf '\n## GitHub CI evidence for current PR HEAD (%s)\n### Check runs\n%s\n\n### Workflow runs\n%s\n' "$HEAD_SHA" "$CHECK_RUNS" "$WORKFLOW_RUNS"
            printf '\nSuccessful GitHub Actions runs on this exact HEAD are authoritative evidence for platform-specific CI that cannot run on this Linux QA runner. Do not fail or require human validation solely because a local platform tool (for example xcodebuild) is unavailable when the corresponding required CI workflow/check succeeded on this HEAD. Still fail for an actually failed/cancelled required check, or require validation when required CI evidence is missing or pending.\n'
            printf '\nInspect repository docs/workflows to discover the appropriate build/test commands. Return only schema-valid JSON.\n'
          } > qa-prompt.md

      - name: Run independent QA
        id: qa_agent
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          working-directory: target
          prompt-file: qa-prompt.md
          output-schema-file: ${{ github.workspace }}/control/agents/qa-schema.json
          output-file: ${{ github.workspace }}/qa-result.json
          allow-bots: true

      - name: Parse QA result
        id: parse
        run: |
          cat qa-result.json | jq .
          echo "verdict=$(jq -r '.verdict' qa-result.json)" >> "$GITHUB_OUTPUT"
          echo "needs_human=$(jq -r '.needs_human' qa-result.json)" >> "$GITHUB_OUTPUT"

      - name: Classify auto-merge eligibility
        id: risk
        if: steps.parse.outputs.verdict == 'pass' && steps.parse.outputs.needs_human != 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          ISSUE_NUMBER: ${{ needs.select.outputs.issue }}
        run: |
          echo "eligible=false" >> "$GITHUB_OUTPUT"
          ISSUE_BODY=$(gh api "repos/$TARGET_REPO/issues/$ISSUE_NUMBER" --jq '.body // ""')
          FILES=$(gh pr diff "$PR_NUMBER" --repo "$TARGET_REPO" --name-only)
          if printf '%s\n%s\n' "$ISSUE_BODY" "$FILES" | grep -Eiq '(needs[ _-]?human|human acceptance|manual approval|required human|payment|billing|production deploy|release to production|database migration|schema migration|\.github/workflows/|secrets?|entitlements|privacy|terms|legal)'; then
            echo "Risk policy requires Product Owner handoff."
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Publish QA report
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          HEAD_SHA: ${{ needs.select.outputs.head }}
        run: |
          {
            printf '<!-- venture-qa:%s -->\n' "$HEAD_SHA"
            printf '### 🧪 Independent QA\n\n'
            jq -r '"**Verdict:** `" + .verdict + "`\n\n" + .summary + "\n\n#### Checks\n" + ([.checks[] | "- `" + .command + "` — **" + .result + "**"] | join("\n")) + (if (.blocking_failures|length)>0 then "\n\n#### Blocking failures\n" + ([.blocking_failures[] | "- " + .] | join("\n")) else "" end) + (if .needs_human then "\n\n**Human validation required:** " + .human_validation else "" end)' qa-result.json
          } > qa-comment.md
          gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body-file qa-comment.md

      - name: Upload QA result
        uses: actions/upload-artifact@v4
        with:
          name: qa-result
          path: qa-result.json
          retention-days: 3

  fix_qa:
    needs: [select, review, qa]
    if: needs.qa.outputs.verdict == 'fail' && needs.qa.outputs.needs_human != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.select.outputs.repo }}
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          ref: ${{ needs.select.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - uses: actions/download-artifact@v4
        with:
          name: qa-result
          path: reports

      - name: Build QA Fixer prompt
        run: |
          {
            cat control/agents/fixer.md
            printf '\n\n---\n# QA failure report\n'
            cat reports/qa-result.json
          } > fixer-prompt.md

      - name: Run QA Fixer
        id: fixer
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          working-directory: target
          prompt-file: fixer-prompt.md
          allow-bots: true

      - name: Commit and push QA fixes
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          BRANCH_NAME: ${{ needs.select.outputs.branch }}
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "QA Fixer produced no changes."
            exit 0
          fi
          git config user.name "venture-lab-fixer[bot]"
          git config user.email "venture-lab-fixer@users.noreply.github.com"
          git add -A
          git commit -m "fix: address QA failures"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" "HEAD:${BRANCH_NAME}"

      - name: Report QA Fixer cycle
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          FIXER_SUMMARY: ${{ steps.fixer.outputs.final-message }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body "### 🔧 QA Fixer\n\n$FIXER_SUMMARY\n\nThe review cycle will restart against the new commit."

  handoff:
    needs: [select, review, qa]
    if: always() && needs.select.outputs.found == 'true' && (needs.review.outputs.needs_human == 'true' || (needs.qa.outputs.verdict == 'pass' && needs.qa.outputs.auto_merge_eligible != 'true') || needs.qa.outputs.needs_human == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.select.outputs.repo }}
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          ref: ${{ needs.select.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - uses: actions/download-artifact@v4
        with:
          name: reviewer-result
          path: reports

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-result
          path: reports

      - name: Build Human Handoff prompt
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          ISSUE_NUMBER: ${{ needs.select.outputs.issue }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
        run: |
          ISSUE_BODY=$(gh api "repos/$TARGET_REPO/issues/$ISSUE_NUMBER" --jq '.body // ""')
          PR_BODY=$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json body --jq '.body // ""')
          [ -f reports/qa-result.json ] || printf '{"verdict":"not_run","summary":"QA did not run because human input is needed first."}' > reports/qa-result.json
          {
            cat control/agents/handoff.md
            printf '\n\n---\n# Handoff context\nRepository: %s\nIssue: #%s\nPR: #%s\n\n' "$TARGET_REPO" "$ISSUE_NUMBER" "$PR_NUMBER"
            printf '## Issue contract\n%s\n\n## PR description\n%s\n\n## Reviewer result\n' "$ISSUE_BODY" "$PR_BODY"
            cat reports/review-result.json
            printf '\n\n## QA result\n'
            cat reports/qa-result.json
            printf '\nReturn only schema-valid JSON.\n'
          } > handoff-prompt.md

      - name: Generate Product Owner handoff
        id: handoff_agent
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          working-directory: target
          prompt-file: handoff-prompt.md
          output-schema-file: ${{ github.workspace }}/control/agents/handoff-schema.json
          output-file: ${{ github.workspace }}/handoff-result.json
          allow-bots: true

      - name: Publish Human Handoff
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          HEAD_SHA: ${{ needs.select.outputs.head }}
        run: |
          {
            printf '<!-- venture-human-ready:%s -->\n' "$HEAD_SHA"
            printf '## 👤 Needs You — Product Owner Handoff\n\n'
            printf '### Done\n'
            jq -r '.done[] | "- " + .' handoff-result.json
            printf '\n### Your job\n'
            jq -r '.your_job' handoff-result.json
            printf '\n\n### How to review it\n'
            jq -r '.steps | to_entries[] | "" + ((.key + 1)|tostring) + ". " + .value' handoff-result.json
            printf '\n### Tell the AI team\n'
            jq -r '.questions[] | "- " + .' handoff-result.json
            printf '\n### If you approve\n'
            jq -r '.approve_action + "\n\n**Then:** " + .after_approve' handoff-result.json
          } > handoff-comment.md
          gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body-file handoff-comment.md

  auto_merge:
    needs: [select, review, qa]
    if: always() && needs.select.outputs.found == 'true' && needs.review.outputs.verdict == 'approve' && needs.review.outputs.needs_human != 'true' && needs.qa.outputs.verdict == 'pass' && needs.qa.outputs.needs_human != 'true' && needs.qa.outputs.auto_merge_eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Re-check exact HEAD and auto-merge routine change
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.select.outputs.repo }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          REVIEWED_HEAD: ${{ needs.select.outputs.head }}
        run: |
          CURRENT_HEAD=$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json headRefOid --jq '.headRefOid')
          [ "$CURRENT_HEAD" = "$REVIEWED_HEAD" ] || { echo "PR head moved; refusing auto-merge."; exit 1; }
          gh pr merge "$PR_NUMBER" --repo "$TARGET_REPO" --squash --delete-branch
