name: New idea / 新想法
description: Drop in a raw idea. The Product Brain researches it and replies with findings and 1–3 questions.
title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Write it the way you would tell a friend. Rough is fine; the Product Brain does the market research and framing, then replies here.
        像跟朋友聊天一样写下来就好，粗糙也没关系。AI 产品经理会去做市场调研，然后在这里回复你。

  - type: textarea
    id: idea
    attributes:
      label: The idea / 想法
      description: What do you want to make, and for whom? / 你想做什么？给谁用？
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why you care / 为什么想做
      description: Optional. A personal pain, something you noticed, a person you know who needs it. / 选填：你自己的痛点、观察到的现象、身边需要它的人。

  - type: textarea
    id: references
    attributes:
      label: References / 参考
      description: Optional. Apps, links, screenshots, competitors. / 选填：类似的 app、链接、截图、竞品。
